services:
  postgres:
    image: postgres:16
    container_name: portfoliolab-db
    environment:
      POSTGRES_USER: portfoliolab
      POSTGRES_PASSWORD: portfoliolab
      POSTGRES_DB: portfoliolab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # "Container no ar" não é "banco aceitando conexão". O `docker compose up --wait`
    # do `npm run db:local` espera este check passar antes de aplicar as migrations.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfoliolab -d portfoliolab"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
